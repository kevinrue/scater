biocjobs: "1.0"
name: plot-coldata
package: scater
title: Plot column metadata
tagline: Plot column-level (i.e., cell) metadata in an SingleCellExperiment object.
description: >
  Plot column-level (i.e., cell) metadata in an SingleCellExperiment object,
  stored in an H5AD file.
version: "0.1.0"
license: MIT
script: scripts/plot-coldata.R
depends: [anndataR]

container: ghcr.io/kevinrue/scater:devel

inputs:
  - name: infile
    format: h5ad
    label: Short UI label
    help: >
      Longer help text: expected columns, units, how to produce it.

outputs:
  - name: outfile
    format: pdf
    label: Short UI label

options:
  - name: "y"
    type: string
    required: true
    label: Name of metadata to plot on the Y-axis

  - name: width
    type: float
    default: 3
    min: 0
    label: Plot width (inches)

  - name: height
    type: float
    default: 5
    min: 0
    label: Plot height (inches)

resources:
  cpus: 1
  memory_gb: 4
  disk_gb: 10

# citations:
#   - doi: 10.1000/your.method.paper

tests:
  - inputs:
      infile: test-data/sce.rna-qc.h5ad
    options:
      "y": sum
      width: 3
      height: 5
    outputs:
      outfile:
        file: test-data/sum.pdf
        compare: sim_size
        delta: 3000
